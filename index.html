<!DOCTYPE html>
<html lang="ru">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Список дел</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;          
        }
        body {
            background: #1e1e1e;
            color: #eee;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #fff;
        }
        .counters {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
        }
        .counters div {
            margin: 2px 0;
        }
        .add-section {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        #newTask {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #2d2d2d;
            color: #fff;
        }
        #newTask::placeholder {
            color: #aaa;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        button.delete {
            background: #f44336;
        }
        button.sync {
            background: #2196F3;
            margin-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #2d2d2d;
            margin-bottom: 8px;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }
        .task-text{
            flex: 1;
            font-size: 16px;
        }
        .delete-btn {
            background: #f44336;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .counter {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Список дел</h1>

        <div class="counters" id="countersBlock">
            <div id="dayCounter">Действий сегодня: 000</div>
            <div id="totalCounter">Всего действий: 0000</div>
        </div>

        <div class="add-section">
            <input type="text" id="newTask" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>

        <button class="sync" id="refreshBtn">🔄 Обновить</button>

        <div class="counter" id="taskCounter">Всего задач: 0</div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = '/api/tasks';
        const COUNTERS_URL = '/api/counters';

        async function loadTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();
                renderTasks(tasks);
                updateTaskCounter(tasks);
            } catch (e) {
                alert('Ошибка загрузки задач');
            }
        }

        async function loadCounters() {
            try {
                const res = await fetch(COUNTERS_URL);
                const counters = await res.json();
                document.getElementById('dayCounter').textContent = `Действий сегодня: ${counters.day}`;
                document.getElementById('totalCounter').textContent = `Всего действий: ${counters.total}`;
            } catch (e) {
                console.log('Ошибка загрузки счётчиков');
            }
        }

        async function saveTasks(tasks) {
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(tasks)
            });
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');

                // Пытаемся отобразить в формате "ЧЧ:ММ текст", если есть дата
                const match = task.match(/^\d{4}-\d{2}-\d{2} (\d{2}:\d{2}) (.*)$/);
                let displayText = task;
                if (match) {
                    displayText = `${match[1]} ${match[2]}`;
                }

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = displayText;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', () => deleteTask(index, tasks));

                li.appendChild(span);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        function updateTaskCounter(tasks) {
            document.getElementById('taskCounter').textContent = `Всего задач: ${tasks.length}`;
        }

        async function deleteTask(index, tasks) {
            tasks.splice(index, 1);
            await saveTasks(tasks);
            renderTasks(tasks);
            updateTaskCounter(tasks);
            loadCounters();
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const input = document.getElementById('newTask');
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const timestamp = `${hours}:${minutes}`;
            const fullTask = `${dateStr} ${timestamp} ${text}`;

            const tasks = await (await fetch(API_URL)).json();
            tasks.push(fullTask);
            await saveTasks(tasks);
            input.value = '';
            renderTasks(tasks);
            updateTaskCounter(tasks);
            loadCounters();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadTasks();
            loadCounters();
        });

        loadTasks();
        loadCounters();
        setInterval(() => {
            loadTasks();
            loadCounters();
        }, 5000);
    </script>
</body>
</html>
