<!DOCTYPE html>
<html lang="ru">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Список дел</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, system-ui, -apple-system, 'Segoe UI', sans-serif;          
    }
    body {
        background: #1e1e1e;
        color: #eee;
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .container {
        max-width: 500px;
        margin: 0 auto;
        width: 100%;
    }
    h1 {
        font-size: 1.8rem;
        margin-top: 0;
        color: #fff;
    }
    .add-section {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }
    #newTask {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #2d2d2d;
        color: #fff;
    }
    #newTask::placeholder {
        color: #aaa;
    }
    button {
        background: #4ACF50;
        border: none;
        color: white;
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
    }
    button.delete {
        background: #f44336;
    }
    button.sync {
        background: #2193f3;
        margin-bottom: 10px;
    }
    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    li {
        background: #2d2d2d;
        margin-bottom: 8px;
        padding: 12px 16px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        word-break: break-word;
    }
    li.completed {
        opacity: 0.7;
        background: #3a3a3a;
        text-decoration: line-through;
        color: #aaa;
    }
    .task-text{
        flex: 1;
        font-size: 16px;
    }
    .task-checkbox {
        width: 24px;
        height: 24px;
        cursor: pointer;
        accent-color: #4CAF50;
    }
    .delete-btn {
        background: #f44336;
        border: none;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .counter {
        background: #2d2d2d;
        padding: 12px;
        border-radius: 8px;
        margin: 16px 0;
        text-align: center;
        font-size: 18px;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Список дел</h1>

        <div class="add-section">
            <input type="text" id="newTask" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>

        <button class="sync" id="refreshBtn">🔄 Обновить</button>

        <div class="counter" id="counter">Загрузка...</div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = '/api/tasks';

        async function loadTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();
                renderTasks(tasks);
                updateCounter(tasks);
            } catch (e) {
                alert('Ошибка загрузки')
            }
        }

        async function saveTasks(tasks) {
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(tasks)
            });
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = task.startsWith('✔ ') ? 'completed' :'';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.checked = task.startsWith('✔ ');
                checkbox.addEventListener('change', () => toggleTask(index, tasks));

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.startsWith('✔ ') ? task.substring(2) : task;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', () => deleteTask(index, tasks));

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        function updateCounter(tasks) {
            const total = tasks.length;
            const completed = tasks.filter(t => t.startsWith('✔ ')).length;
            document.getElementById('counter').textContent = `Всего ${total}    |   Выполнено: ${completed}`;
        }

        async function toggleTask(index, tasks) {
            const task = tasks[index];
            if (task.startsWith('✔ ')) {
                tasks[index] = task.substring(2);
            } else {
                tasks[index] = '✔ ' + task;
            }
            await saveTasks(tasks);
            renderTasks(tasks);
            updateCounter(tasks);
        }

        async function deleteTask(index, tasks) {
           tasks.splice(index, 1);
           await saveTasks(tasks);
           renderTasks(tasks);
           updateCounter(tasks);
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const input = document.getElementById('newTask');
            const text = input.value.trim();
            if (!text) return;

            // Добавляем задачу с текущий датой (как в детскопной версии)
            const now = new Date();
            const timestamp = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
            const fullTask = `[${timestamp}] ${text}`;

            const tasks = await (await fetch(API_URL)).json();
            tasks.push(fullTask);
            await saveTasks(tasks);
            input.value = '';
            renderTasks(tasks);
            updateCounter(tasks);
        });

        document.getElementById('refreshBtn').addEventListener('click', loadTasks);

        // Загружаем при старте
        loadTasks(); 
        setInterval(loadTasks, 5000);
    </script>
</body>
</html>
